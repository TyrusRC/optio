[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optio"
version = "0.0.1"
description = "A terminal cockpit for pentesters — run your tools, remember the flags, track every target, without the noise."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
optio = "optio.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/optio"]

[tool.hatch.build.targets.wheel.force-include]
"src/optio/data" = "optio/data"
"src/optio/web/static" = "optio/web/static"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
